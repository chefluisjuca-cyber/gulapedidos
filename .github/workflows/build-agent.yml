name: Build Print Agent (Windows)

on:
  push:
    paths:
      - 'print-agent/**'
      - '.github/workflows/build-agent.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: print-agent/package-lock.json

      - name: Install dependencies
        working-directory: ./print-agent
        run: npm install

      - name: Build TypeScript
        working-directory: ./print-agent
        run: npm run build

      - name: Package with electron-builder
        working-directory: ./print-agent
        run: npx electron-builder --win --x64 --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gula-Print-Agent-Setup
          path: print-agent/release/*.exe
          if-no-files-found: warn

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: print-agent/release/*.exe
          name: Gula Print Agent ${{ github.ref_name }}
          body: |
            ## Gula Print Agent — Instalador Windows

            ### Como instalar
            1. Baixe o arquivo `.exe` abaixo
            2. Execute (duplo clique) no computador Windows do restaurante
            3. Siga as instruções do instalador
            4. Abra o Gula Print Agent e cole o código de vinculação gerado no painel do SaaS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
